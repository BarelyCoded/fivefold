# Render blueprint: deploy the Fivefold multiplayer relay as a single always-on web service.
# It serves the game AND the 1v1 lobby on one HTTPS URL, so players just open the link and play —
# no relay address to type, no tunnel. See MULTIPLAYER.md for the click-through steps.
#
# One-click: push this repo to GitHub, then in Render choose "New +" -> "Blueprint" and pick the repo.
services:
  - type: web
    name: fivefold-relay
    runtime: node
    plan: starter         # always-on; "free" spins down when idle (first visitor waits ~30-60s) and cannot mount a disk
    buildCommand: npm install   # no dependencies, so this is effectively a no-op
    startCommand: node relay.js  # Render injects PORT, which relay.js already honors
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: LOG_TOKEN        # needed to read the game logs back: node tools/gamelogs.mjs --pull <url> --token <this>
        generateValue: true
      - key: LOG_DIR          # game logs live on the persistent disk below, so they survive deploys and restarts
        value: /data
    # Game logs (logs/games.jsonl) persist here. A disk pins the service to one instance and turns off
    # zero-downtime deploys — fine for a relay; the multiplayer lobby is in memory anyway.
    disk:
      name: gamelogs
      mountPath: /data
      sizeGB: 1
